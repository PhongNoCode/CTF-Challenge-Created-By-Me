<!DOCTYPE html>
<html>
    <head>
        <body>
            <h1>Bài tổng ôn</h1>
            <h2>Thực hiện lệnh để truy vấn được thông tin của admin để chứng minh SQLi</h2>
            <h2>Nếu password thu được dạng hash, nhiệm vụ cuối cùng là tìm ra dạng plaintext</h2>

                <input type="text" name="username" placeholder="Username">

            <p>Result from command: {{Result}}</p>

    </head>
</html>
